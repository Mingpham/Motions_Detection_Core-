[project]
name = "movecore"
version = "0.1.0"
description = "Camera-based movement detection core: classic motion detection and hand gesture recognition."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "mediapipe>=1.2.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
movecore = "movecore.cli:main"

[dependency-groups]
dev = [
    "pip-audit",
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movecore"]

[tool.uv]
# Never pick up the Anaconda interpreter on PATH; it may be Intel.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
