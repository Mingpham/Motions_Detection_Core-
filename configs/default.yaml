# All v1 modules.
input:
  width: 640
  height: 480
  # Camera name (list them with `system_profiler SPCameraDataType`) or index.
  # A name keeps the iPhone's Continuity Camera from being picked by mistake.
  camera: FaceTime HD
  flip: true

modules:
  motion:
    enabled: true
    method: mog2          # diff (frame differencing) | mog2 | knn (background subtraction)
    blur: 21              # Gaussian blur size (odd) before comparing; smooths sensor noise
    threshold: 25         # diff only: brightness change (0-255) that counts as motion
    history: 500          # mog2/knn: how many frames the background model remembers
    var_threshold: 16     # mog2 only: squared color distance (16 = 4 std devs) before a pixel is foreground
    detect_shadows: true  # mog2/knn: mark shadows separately so they can be ignored
    background_ratio: 0.7 # mog2 only: lower keeps still objects visible longer, flags flicker more
    kernel_size: 5        # morphology kernel (odd): bigger removes more specks, merges more
    min_area: 500         # ignore shapes smaller than this many pixels (also the zone trigger)
    warmup_frames: 30     # no events while the model learns the scene (~1 s)
    start_frames: 2       # frames of motion in a row before motion.start / zone.enter
    stop_frames: 15       # frames of stillness in a row before motion.stop / zone.leave
    # Zones are [x, y, width, height] as fractions of the (mirrored) frame:
    # zones:
    #   left_half: [0.0, 0.0, 0.5, 1.0]
    #   top_right: [0.5, 0.0, 0.5, 0.5]
    zones: {}
  optical_flow:
    enabled: true
    mode: sparse          # sparse: Lucas-Kanade on corners (fast) | dense: Farneback on every pixel
    max_corners: 200      # sparse: most corners tracked per frame
    min_points: 5         # sparse: moving corners needed before a direction is reported
    min_speed: 40         # px/s; anything slower counts as still
    dense_scale: 0.5      # dense: shrink frames first (0.5 = 4x fewer pixels to compute)
    stable_frames: 3      # frames a direction must hold before a flow.direction event
  hands:
    enabled: true
    max_hands: 2                  # 1 or 2; hands are told apart by side (Left/Right)
    min_detection_confidence: 0.5 # palm detector: how sure before a new hand counts
    min_tracking_confidence: 0.5  # below this, the hand is searched for again from scratch
    mirrored: true                # match input.flip, so Left/Right are your real hands
    pinch_ratio: 0.25             # rules: thumb and index tips closer than this x hand size = pinch
    min_gesture_score: 0.5        # built-in recognizer: ignore labels it's less sure of
    min_classifier_score: 0.7     # custom classifier: ignore labels it's less sure of
    start_frames: 3               # frames a hand must be seen before hand.enter
    stop_frames: 10               # frames it must be missing before hand.leave
    stable_frames: 5              # frames a gesture must hold before gesture.detected
    landmarker_model: models/hand_landmarker.task      # used when builtin_recognizer is off
    recognizer_model: models/gesture_recognizer.task   # includes the landmarker; used when on
    classifier_model: models/gesture_clf.npz           # made by scripts/train_gesture_classifier.py
    gestures:
      rules: true                 # finger count, pinch, thumb up/down from geometry
      builtin_recognizer: true    # MediaPipe's 7 trained gestures
      custom_classifier: false    # your own gestures; record and train first (docs/fundamentals/05)
      dynamic: false              # M6

output:
  overlay: true
  show_fps: true
  event_log: logs/events.jsonl
  record: false
