# Classic motion module only.
input:
  width: 640
  height: 480
  flip: false

modules:
  motion:
    enabled: true
    method: mog2
    min_area: 500
    zones: {}
  optical_flow:
    enabled: false
    mode: sparse

output:
  overlay: true
  show_fps: true
  event_log: logs/events.jsonl
  record: false
