# Classic motion module only.
input:
  width: 640
  height: 480
  # Camera name (list them with `system_profiler SPCameraDataType`) or index.
  # A name keeps the iPhone's Continuity Camera from being picked by mistake.
  camera: FaceTime HD
  flip: false

modules:
  motion:
    enabled: true
    method: mog2
    min_area: 500
    zones: {}
  optical_flow:
    enabled: false
    mode: sparse

output:
  overlay: true
  show_fps: true
  event_log: logs/events.jsonl
  record: false
