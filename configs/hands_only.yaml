# Hand gesture module only.
input:
  width: 640
  height: 480
  flip: true

modules:
  hands:
    enabled: true
    max_hands: 2
    min_detection_confidence: 0.5
    gestures:
      rules: true
      builtin_recognizer: true
      custom_classifier: false
      dynamic: false

output:
  overlay: true
  show_fps: true
  event_log: logs/events.jsonl
  record: false
